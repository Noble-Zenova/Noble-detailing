# Noble Detailing — Netlify deploy config
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200
  force = true

[[redirects]]
  from = "/booking/"
  to = "/booking"
  status = 301
  force = true
